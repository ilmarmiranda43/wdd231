<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">MoveWell Personal Fitness Tracker</title>
  <desc id="description">A dark green fitness dashboard graphic with coral activity bars.</desc>
  <rect width="1200" height="630" fill="#17231c"/>
  <circle cx="1060" cy="90" r="220" fill="none" stroke="#dff4e8" stroke-opacity=".12" stroke-width="2"/>
  <rect x="110" y="110" width="72" height="72" rx="18" fill="#176b49"/>
  <rect x="127" y="146" width="9" height="20" rx="4" fill="#fff"/>
  <rect x="141" y="136" width="9" height="30" rx="4" fill="#fff"/>
  <rect x="155" y="125" width="9" height="41" rx="4" fill="#fff"/>
  <text x="205" y="160" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="700">MoveWell</text>
  <text x="110" y="285" fill="#ffffff" font-family="Arial, sans-serif" font-size="70" font-weight="700">Track movement.</text>
  <text x="110" y="370" fill="#ffffff" font-family="Arial, sans-serif" font-size="70" font-weight="700">Build momentum.</text>
  <text x="115" y="430" fill="#bcd2c5" font-family="Arial, sans-serif" font-size="28">Personal fitness progress, one workout at a time.</text>
  <g transform="translate(760 250)" fill="#e86a45">
    <rect x="0" y="150" width="48" height="90" rx="12"/><rect x="68" y="105" width="48" height="135" rx="12"/><rect x="136" y="175" width="48" height="65" rx="12"/><rect x="204" y="55" width="48" height="185" rx="12"/><rect x="272" y="120" width="48" height="120" rx="12"/>
  </g>
</svg>
